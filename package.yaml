name: secp256k1-haskell
version: 3.0.0
synopsis: Bindings for secp256k1
description: Sign and verify signatures using the secp256k1 library.
category: Crypto
author: JP Rupp
maintainer: jprupp@protonmail.ch
license: MIT
license-file: LICENSE
github: jprupp/secp256k1-haskell
homepage: http://github.com/jprupp/secp256k1-haskell#readme
extra-source-files:
  - CHANGELOG.md
  - README.md
flags:
  recovery:
    description: Bind the ECDSA public key recovery module of libsecp256k1. The library must have been built with it (--enable-module-recovery), as the packages of the Linux distributions, Homebrew and Nixpkgs are. Turn the flag off for a library built without it.
    manual: true
    default: true
dependencies:
  - base >=4.9 && <5
  - base16 >=2.0
  - bytestring >=0.10.8
  - entropy >=0.3.8
  - deepseq >=1.4.2
  - hashable >=1.2.6
  - QuickCheck >=2.9.2
  - string-conversions >=0.4
library:
  source-dirs: src
  c-sources:
    - cbits/illegal_callback.c
  ghc-options:
    - -Wall
  generated-exposed-modules:
    - Paths_secp256k1_haskell
  # The modules that hold the global context, or whose bindings make, take or
  # name a context, are hidden, so that no user of the package can reach a
  # context. Every other module in src is exposed.
  other-modules:
    - Crypto.Secp256k1.Internal.BaseOps
    - Crypto.Secp256k1.Internal.Context
    - Crypto.Secp256k1.Internal.ContextOps
  pkg-config-dependencies:
    - libsecp256k1 >= 0.2.0
  when:
    - condition: flag(recovery)
      exposed-modules:
        - Crypto.Secp256k1.Internal.Recovery
        - Crypto.Secp256k1.Recovery
      other-modules:
        - Crypto.Secp256k1.Internal.RecoveryOps
tests:
  spec:
    main: Spec.hs
    # The tests compile the sources of the library themselves instead of
    # depending on it, because they test the raw bindings in its hidden
    # modules.
    source-dirs:
      - test
      - src
    c-sources:
      - cbits/illegal_callback.c
    pkg-config-dependencies:
      - libsecp256k1 >= 0.2.0
    ghc-options:
      - -Wall
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    verbatim:
      build-tool-depends:
          hspec-discover:hspec-discover
    dependencies:
      - hspec
      - monad-par
      - mtl
      - HUnit
    when:
      - condition: flag(recovery)
        cpp-options: -DRECOVERY
        other-modules:
          - Crypto.Secp256k1.Internal.Recovery
          - Crypto.Secp256k1.Internal.RecoveryOps
          - Crypto.Secp256k1.Recovery
