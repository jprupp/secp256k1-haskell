name: secp256k1-haskell
version: 2.0.1
synopsis: Bindings for secp256k1
description: Sign and verify signatures using the secp256k1 library.
category: Crypto
author: JP Rupp
maintainer: jprupp@protonmail.ch
license: MIT
license-file: LICENSE
github: jprupp/secp256k1-haskell
homepage: http://github.com/jprupp/secp256k1-haskell#readme
extra-source-files:
  - CHANGELOG.md
  - README.md
flags:
  recovery:
    description: Bind the ECDSA public key recovery module of libsecp256k1. The library must have been built with it (--enable-module-recovery), as the packages of the Linux distributions, Homebrew and Nixpkgs are. Turn the flag off for a library built without it.
    manual: true
    default: true
dependencies:
  - base >=4.9 && <5
  - base16 >=2.0
  - bytestring >=0.10.8
  - entropy >=0.3.8
  - deepseq >=1.4.2
  - hashable >=1.2.6
  - QuickCheck >=2.9.2
  - string-conversions >=0.4
library:
  source-dirs: src
  c-sources:
    - cbits/illegal_callback.c
  ghc-options:
    - -Wall
  generated-exposed-modules:
    - Paths_secp256k1_haskell
  pkg-config-dependencies:
    - libsecp256k1 >= 0.2.0
  when:
    - condition: flag(recovery)
      exposed-modules:
        - Crypto.Secp256k1.Internal.Recovery
        - Crypto.Secp256k1.Internal.RecoveryOps
        - Crypto.Secp256k1.Recovery
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -Wall
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    verbatim:
      build-tool-depends:
          hspec-discover:hspec-discover
    dependencies:
      - hspec
      - secp256k1-haskell
      - monad-par
      - mtl
      - HUnit
    when:
      - condition: flag(recovery)
        cpp-options: -DRECOVERY
